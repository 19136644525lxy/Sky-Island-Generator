# Gradle 内存配置(用于 MC 反编译过程)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# Minecraft 版本(必须与 Forge 版本对应)
minecraft_version=1.20.1
# Minecraft 版本范围
minecraft_version_range=[1.20.1,1.21)
# Forge 版本(必须与 MC 版本对应)
forge_version=47.4.22
# Forge 版本范围
forge_version_range=[47,)
# Loader 版本范围
loader_version_range=[47,)
# 映射通道
mapping_channel=official
# 映射版本(必须匹配通道格式)
mapping_version=1.20.1


## Mod Properties

# 空岛生成器模组 ID
mod_id=skyisland
# 显示名称
mod_name=Sky Island Generator
# 许可证
mod_license=MIT
# 模组版本
mod_version=1.0.0
# 包路径
mod_group_id=com.skyisland
# 作者
mod_authors=Yifei,ZhangXaohan
# 描述
mod_description=Adds a Sky Island world type with 5x5 starting platforms in all dimensions while preserving vanilla structures and spawners.
